name: Demo Build-and-Scan (Trivy via GHCR)

on:
  push:
    branches: [demo]
  workflow_dispatch:

env:
  IMAGE_NAME: product-service
  IMAGE_TAG: ci-${{ github.run_id }}

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: "Debug: show repo top-level"
        run: |
          pwd
          ls -la
          echo "--- backend ---"
          ls -la backend || true
          echo "--- backend/product_service ---"
          ls -la backend/product_service || true

      - name: Build Docker image
        run: |
          docker build -t $IMAGE_NAME:$IMAGE_TAG backend/product_service

      - name: Pull Trivy image (from GHCR)
        run: docker pull ghcr.io/aquasecurity/trivy:latest

      - name: Scan with Trivy (pass unless CRITICAL)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            ghcr.io/aquasecurity/trivy:latest image \
            --exit-code 1 \
            --severity CRITICAL \        
            --ignore-unfixed \           
            --format table \
            --output trivy-report.txt \
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Upload Trivy report (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.txt

