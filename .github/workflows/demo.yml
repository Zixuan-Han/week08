name: Demo Build-and-Scan

on:
  push:
    branches:
      - demo
  workflow_dispatch:

env:
  IMAGE_NAME: product-service
  IMAGE_TAG: ci-${{ github.run_id }}

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          cd backend/product_service
          docker build -t $IMAGE_NAME:$IMAGE_TAG .

      - name: Scan image with Trivy (docker image; fail on HIGH/CRITICAL)
        # Use Trivy docker image to scan the local image; mount docker socket
        run: |
          # pull trivy image (optional — docker run will auto-pull)
          docker pull aquasecurity/trivy:latest

          # Run trivy to scan the local image; produce a table report and JSON copy
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasecurity/trivy:latest image \
            --exit-code 1 \
            --severity CRITICAL,HIGH \
            --format table \
            --output trivy-report.txt \
            --format json \
            --output trivy-report.json \
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Upload Trivy report (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: |
            trivy-report.txt
            trivy-report.json
