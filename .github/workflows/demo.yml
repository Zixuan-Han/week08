name: Demo Build-and-Scan

on:
  push:
    branches:
      - demo
  workflow_dispatch:

env:
  IMAGE_NAME: product-service
  IMAGE_TAG: ci-${{ github.run_id }}

jobs:
  build-and-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Debug: show repo top-level (optional)
        run: |
          echo "Working directory:"
          pwd
          echo "Top-level files:"
          ls -la

      - name: Build Docker image
        run: |
          # build with explicit context path (no cd)
          docker build -t $IMAGE_NAME:$IMAGE_TAG backend/product_service
          # 如果真实路径是 week08/backend/product_service，请把上一行改成：
          # docker build -t $IMAGE_NAME:$IMAGE_TAG week08/backend/product_service

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull Trivy image (from Docker Hub)
        run: |
          docker pull aquasecurity/trivy:latest

      - name: Scan image with Trivy (docker image; fail on HIGH/CRITICAL)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasecurity/trivy:latest image \
            --exit-code 1 \
            --severity CRITICAL,HIGH \
            --format table \
            --output trivy-report.txt \
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Upload Trivy report (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.txt
